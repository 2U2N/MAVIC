[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mavic-assessment"
version = "1.0.0rc1"
description = "Interpretable assessment of computational video representations with MAVIC"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
analysis = [
  "pyarrow>=21",
]
openclip = [
  "av>=12.0",
  "open-clip-torch>=2.26",
  "pillow>=10.0",
  "torch>=2.2",
]
lco = [
  "av>=12.0",
  "nvidia-ml-py==13.610.43",
  "qwen-omni-utils==0.0.9",
  "torch>=2.2",
  "torchcodec==0.14.0",
  "transformers==5.13.1",
]
f2llm = [
  "nvidia-ml-py==13.610.43",
  "sentence-transformers==5.6.0",
  "torch>=2.2",
  "transformers==5.13.1",
]
test = [
  "av>=12.0",
  "pytest>=8.0",
  "torch>=2.2",
]

[project.scripts]
mavic = "mavic.cli:main"
mavic-openclip-embed = "mavic.representations.openclip.cli:main"
mavic-lco-embed = "mavic.representations.lco.cli:main"
mavic-f2llm-embed = "mavic.representations.f2llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mavic = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires restricted research inputs",
  "model: loads real model weights",
  "lco_model: loads the real LCO model",
]
